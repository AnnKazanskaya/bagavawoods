<!DOCTYPE html>
<html lang="ru" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лист не найден — BAGAVAWOODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Caveat:wght@500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bagavawoods/style.css?v=13">
<script>(function(){try{var t=sessionStorage.getItem('bw-theme');if(!t){t='day';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 40px var(--gutter); position: relative; }
  .nf__board { position: relative; max-width: 760px; width: 100%; border: var(--lw) solid var(--line); padding: clamp(28px, 6vw, 64px); background: var(--bg); }
  .nf__num { font-weight: 700; font-size: clamp(5rem, 22vw, 14rem); line-height: .95; letter-spacing: -.03em; }
  .nf__t { font-weight: 700; text-transform: uppercase; font-size: clamp(1.4rem, 3.6vw, 2.4rem); line-height: 1.05; margin-top: 8px; }
  .nf__p { margin: 18px 0 28px; color: var(--ink-2); max-width: 46ch; }
  .nf__stamp { position: absolute; right: 8%; top: 12%; transform: rotate(-14deg); font-weight: 700; text-transform: uppercase; font-size: clamp(2rem, 7vw, 4.6rem); letter-spacing: .1em; color: #b3261e; border: 6px double #b3261e; padding: 6px 18px; opacity: .85; mix-blend-mode: multiply; }
  :root[data-theme="night"] .nf__stamp { color: #d9603a; border-color: #d9603a; mix-blend-mode: normal; }
  .nf__grain { position: absolute; inset: 0; pointer-events: none; opacity: .35; background-image: repeating-linear-gradient(-2deg, transparent 0 18px, var(--line-soft) 18px 19px); }
  .nf__hand { font-family: var(--font-hand); font-size: 1.3rem; color: var(--ink-2); margin-top: 18px; display: block; }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="nf">
  <div class="nf__board">
    <div class="nf__grain" aria-hidden="true"></div>
    <span class="nf__stamp" aria-hidden="true">брак</span>
    <span class="num">лист</span>
    <div class="nf__num">404</div>
    <div class="nf__t">Этого листа нет в комплекте</div>
    <p class="nf__p">Доска ушла в брак: сучок, трещина или просто не та страница. Вернитесь к чертежам, там всё на месте.</p>
    <a class="btn" href="/bagavawoods/">На главную <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="nf__hand">Ильшат: «ничего, из брака выходят лучшие полки»</span>
  </div>
</main>
</body>
</html>
